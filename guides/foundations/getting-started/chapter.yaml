name: "Getting Started"
description: "Connect your code and cloud, create your first stack, and understand what's happening during a run."
ordering: 1
variables:
  - name: "space_name"
    description: "The space where you'll create stacks and other resources in this chapter."
    resourceType: "space"
  - name: "main_stack_name"
    description: "Name of the Spacelift stack"
    resourceType: "stack"
  - name: "aws_integration_name"
    description: "Name of the AWS cloud integration"
    resourceType: "aws_integration"
  - name: "policy_name"
    description: "Name of the plan policy"
    resourceType: "policy"
  - name: "dependency_stack_name"
    description: "Name of the networking stack"
    resourceType: "stack"

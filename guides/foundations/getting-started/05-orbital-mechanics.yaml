slug: orbital-mechanics
ordering: 5
prerequisiteGuideSlugs:
  - "guardrails"
metadata:
  title: "Orbital Mechanics - Stack Dependencies"
  description: "Coordinate multiple infrastructure stacks by creating dependencies that pass data and control execution order"
  labels: ["stack-dependencies", "orchestration", "outputs", "multi-stack"]
  difficulty: "medium"
  minutesToComplete: 25
  prerequisites:
    - "You should have a working stack (${main_stack_name}) with S3 bucket"
    - "Basic understanding of Terraform outputs and variables"

steps:
  - order: 1
    title: "Create Networking Repository"
    instruction: |
      In your VCS provider, create a new repository for your networking infrastructure. Add a **main.tf** file containing:
      ```language-hcl
      terraform {
        required_providers {
          aws = {
            source  = "hashicorp/aws"
            version = "~> 6.0"
          }
        }
      }

      provider "aws" {
        region = "us-east-1"
      }

      resource "aws_vpc" "main" {
        cidr_block = "10.0.0.0/16"
        tags = {
          name    = "Orbit Labs VPC"
          project = "Orbit-labs"
        }
      }

      resource "aws_subnet" "main" {
        vpc_id            = aws_vpc.main.id
        cidr_block        = "10.0.1.0/24"
        availability_zone = "us-east-1a"
        tags = {
          name    = "Orbit Labs Subnet"
          project = "Orbit-labs"
        }
      }

      output "subnet_id" {
        value       = aws_subnet.main.id
        description = "ID of the main subnet"
      }
      ```

      Commit and push this code.

  - order: 2
    title: "Create Networking Stack in Spacelift"
    instruction: |
      1. Go to [Ship Infra > Stacks](/stacks) and click **Create stack**.
      2. Name: '${dependency_stack_name}', Space: 'root', Description: 'Network infrastructure for Orbit Labs', Labels: 'network,infrastructure'. Click **Continue**.
      3. Select your VCS integration and your networking repository, branch 'main'. Click **Continue**.
      4. Select **OpenTofu**, choose the latest version from the list. Click **Create & Continue**.
      5. Attach your AWS integration with **Read** and **Write** access.
    hint: "This networking stack will be the parent - it runs first and provides outputs to dependent stacks. We're setting it up just like your first stack, but with different code."
    validationHint: "Before moving on, make sure the networking stack is created with an AWS integration attached."
    validation: |
      package spacelift

      dependency_stack := stack if {
        some stack in input.stacks
        stack.name == input.expectations.dependency_stack_name
      }

      dependency_aws_attachment if {
        some attachment in input.aws_attachments
        attachment.attached_to == dependency_stack.id
      }

      valid if {
        dependency_stack
        dependency_aws_attachment
      }

  - order: 3
    title: "Deploy Networking Stack"
    instruction: |
      1. Navigate to your networking stack and click **Trigger**.
      2. Start a tracked run.
      3. Review the plan - it should show creating 1 VPC and 1 subnet.
      4. Click **Confirm** to apply.
      5. Wait for the run to complete successfully.
      6. Once finished, check the **Outputs** section - you should see 'subnet_id' with a value like 'subnet-abc123'.
    hint: "The subnet_id output is now available for other stacks to use. This is the foundation that the app stack will depend on. Copy this subnet ID if you want to verify it later."
    validationHint: "Wait for the run to finish successfully before moving on."
    validation: |
      package spacelift

      dependency_stack := stack if {
        some stack in input.stacks
        stack.name == input.expectations.dependency_stack_name
      }

      tracked_runs contains run if {
        some run in input.runs
        run.stack_id == dependency_stack.id
        run.type == "TRACKED"
      }

      latest_tracked_run := run if {
        some run in tracked_runs
        run.created_at == max([r.created_at | some r in tracked_runs])
      }

      valid if {
        latest_tracked_run.status == "FINISHED"
      }

  - order: 4
    title: "Create Stack Dependency with Output Reference"
    instruction: |
      1. Navigate to your networking stack (${dependency_stack_name}) and go to the **Dependencies** tab.
      2. Click **Add dependencies** under the **Depended on by** section.
      3. Select your app stack (${main_stack_name}) from the dropdown.
      4. Click **Add**.
      5. Then on the dependency you just created, click **Add output reference**.
      6. In **Output name**, enter 'subnet_id'.
      7. In **Input name**, enter 'TF_VAR_subnet_id'.
      8. Click **Add**.
    hint: "This establishes both the relationship and the data flow: networking is the parent, app stack is the child. The dependency reference behaves like an environment variable on the app stack whose value is sourced from the networking stack's 'subnet_id' output — available to every run on the app stack, not just cascaded ones. Adding the reference auto-triggers a run on the app stack to pick up the current value; with the existing app code, this run will be a no-op — confirm it to clear it out."
    validationHint: "Before moving on, make sure the dependency between your stacks is configured."
    validation: |
      package spacelift

      main_stack := stack if {
        some stack in input.stacks
        stack.name == input.expectations.main_stack_name
      }

      dependency_stack := stack if {
        some stack in input.stacks
        stack.name == input.expectations.dependency_stack_name
      }

      valid if {
        some dep in input.stack_dependencies
        dep.stack_id == main_stack.id
        dep.depends_on == dependency_stack.id
      }

  - order: 5
    title: "Configure App Stack to Consume the Input"
    instruction: |
      In your original repository, edit main.tf to add a variable at the top:
      ```language-hcl
      variable "subnet_id" {
        type        = string
        description = "ID of the subnet from networking stack"
      }
      ```
      Then add resources that use this variable:
      ```language-hcl
      data "aws_subnet" "selected" {
        id = var.subnet_id
      }

      data "aws_vpc" "selected" {
        id = data.aws_subnet.selected.vpc_id
      }

      resource "aws_security_group" "app" {
        name        = "orbit-labs-app-sg"
        description = "Security group for Orbit Labs app"
        vpc_id      = data.aws_vpc.selected.id

        tags = {
          name    = "Orbit Labs App SG"
          project = "Orbit-labs"
        }
      }
      ```
      Commit and push. Because the dependency reference set up in the previous step already exposes the networking stack's 'subnet_id' as 'TF_VAR_subnet_id' on the app stack, the run plans cleanly — no manual variable wrangling. Confirm the run to create the security group.
    hint: "This is stack orchestration paying off: with the dependency wired up first, the moment your code starts using 'var.subnet_id', the value is already there. Teams owning networking and app code can ship independently."

  - order: 6
    title: "Test the Dependency Chain End-to-End"
    instruction: |
      Now watch the full chain in action. In your networking repository, edit main.tf and add a tag to the VPC:
      ```language-hcl
      tags = {
        name    = "Orbit Labs VPC"
        project = "Orbit-labs"
        owner   = "Saturnhead"
      }
      ```
      Commit and push this change. The networking stack run will sit unconfirmed until you approve it — **confirm the run** to apply.

      Once it finishes, Spacelift automatically triggers a run on your app stack (${main_stack_name}), carrying the latest 'subnet_id' output. This is the dependency you wired up in step 4 finally doing what it was built for: a change in the parent flowing through to the child without anyone copying values around.
    hint: "This is the cascade payoff: parent applies → child runs → outputs flow through. With autodeploy off, you'll need to confirm the cascaded run on the app stack as well."

completion:
  successMessage: "Outstanding! You've mastered stack dependencies and orchestration. You now understand how to coordinate multiple infrastructure stacks, pass data between them, and control execution order. You're ready to manage complex, multi-stack infrastructure deployments!"
  recommendedGuideIds: []

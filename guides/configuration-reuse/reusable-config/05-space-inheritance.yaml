slug: config-reuse-space-inheritance
ordering: 5
prerequisiteGuideSlugs:
  - "config-reuse-autoattach"
metadata:
  title: "Space Inheritance - Config Flows Downhill"
  description: "Build a space hierarchy where configuration defined at the top cascades down to all child spaces automatically"
  labels: ["spaces", "hierarchy", "inheritance", "organization"]
  difficulty: "medium"
  minutesToComplete: 20
  prerequisites:
    - "Completed the Auto-attachment guide with contexts using label-based attachment"

steps:
  - order: 1
    title: "Create a Team Space"
    instruction: |
      1. Navigate to [Organize > Spaces](/spaces).
      2. Click **Create space**.
      3. Set Name: **${space_name}**, Parent: **${working_space_name}**.
      4. Enable **Inherit entities** from parent.
      5. Click **Create space**.
    hint: "Orbit Labs has teams. Teams have environments. Some config applies to everything underneath. Spaces let you model this hierarchy."
    validationHint: "Your team space should be created under your working space."
    validation: |
      package spacelift

      working_space := space if {
        some space in input.spaces
        space.name == input.expectations.working_space_name
      }

      valid if {
        some space in input.spaces
        space.name == input.expectations.space_name
        space.parent_slug == working_space.slug
      }

  - order: 2
    title: "Create a Production Space"
    instruction: |
      1. Click **Create space** again.
      2. Set Name: **${child_space_name}**, Parent: **${space_name}**.
      3. Enable **Inherit entities** from parent.
      4. Click **Create space**.
    hint: "Now you have a three-level hierarchy: your working space, then your team space, then your production space inside it. Configuration can cascade from any level down to its children."
    validationHint: "The child space should be created under your team space."
    validation: |
      package spacelift

      team_space := space if {
        some space in input.spaces
        space.name == input.expectations.space_name
      }

      valid if {
        some space in input.spaces
        space.name == input.expectations.child_space_name
        space.parent_slug == team_space.slug
      }

  - order: 3
    title: "Move Stack to Production Space"
    instruction: |
      1. Go to [Ship Infra > Stacks](/stacks).
      2. Open your stack **${main_stack_name}**.
      3. Open the three-dot menu and go to `Settings > Stack details`.
      4. Change the `Space` field from **${working_space_name}** to **${child_space_name}**.
      5. Save the change.
    hint: "Moving a stack to a child space doesn't break anything - it just changes where the stack lives in your organizational hierarchy."
    validationHint: "Your stack should be in the child space."
    validation: |
      package spacelift

      child_space := space if {
        some space in input.spaces
        space.name == input.expectations.child_space_name
      }

      main_stack := stack if {
        some stack in input.stacks
        stack.name == input.expectations.main_stack_name
      }

      valid if {
        main_stack.space_slug == child_space.slug
      }

  - order: 4
    title: "Create a Company-Wide Context"
    instruction: |
      1. Navigate to [Reuse config > Contexts](/contexts).
      2. Click **Create context**.
      3. In the wizard, set Name: **${company_context_name}**, Space: **${space_name}**, and add the label `autoattach:*` (asterisk means all).
      4. Still in the wizard, add an environment variable with Name: **COMPANY**, Value: **orbit-labs**. Leave **Mark as secret** off — otherwise the value shows as `*****` in run logs.
      5. In the `Add hooks` step of the wizard, leave **Customize workflow** on `Initialization` and add this to the `Before` card:
      ```language-bash
      echo "Company: $COMPANY"
      ```
      6. Complete the wizard to create the context.
    hint: "The `autoattach:*` label means 'attach to all stacks in this space and below'. Company-wide settings flow down automatically."
    validationHint: "The company context should exist with the `autoattach:*` label and the `COMPANY` environment variable."
    validation: |
      package spacelift

      company_context := ctx if {
        some ctx in input.contexts
        ctx.name == input.expectations.company_context_name
        "autoattach:*" in ctx.labels
        "COMPANY" in ctx.environment_variables
      }

      valid if {
        company_context
      }

  - order: 5
    title: "Verify Inherited Configuration"
    instruction: |
      1. Go to your stack **${main_stack_name}** (in the production space).
      2. Check the `Contexts` tab - you should see **${company_context_name}** attached.
      3. Trigger a run.
      4. In the run logs/outputs, verify the `COMPANY` variable is available.
    hint: "Define it once at the team level, inherit it everywhere below. The space tree becomes your configuration tree."
    validationHint: "The company context should be attached to your stack via inheritance."
    validation: |
      package spacelift

      main_stack := stack if {
        some stack in input.stacks
        stack.name == input.expectations.main_stack_name
      }

      company_context := ctx if {
        some ctx in input.contexts
        ctx.name == input.expectations.company_context_name
      }

      # autoattach:* attaches to all stacks regardless of labels
      valid if {
        some label in company_context.labels
        startswith(label, "autoattach:")
        target := substring(label, count("autoattach:"), -1)
        target == "*"
      }

      # autoattach:<label> attaches to stacks with matching label
      valid if {
        some label in company_context.labels
        startswith(label, "autoattach:")
        target := substring(label, count("autoattach:"), -1)
        target in main_stack.labels
      }

completion:
  successMessage: "Configuration flows downhill through your space hierarchy. Define it once at the top, and everything below inherits it automatically. Next, let's see how this same mechanism works for policies and integrations!"
  recommendedGuideIds: ["config-reuse-unified-mechanism"]
